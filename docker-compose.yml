# Backend stack: Postgres (container), one-off migrations, and the API.
# Run from this folder:  docker compose up --build
# API:       http://localhost:3000/health
# Postgres:  localhost:5432  (user careconnect, db careconnect; localhost only)
# In production (Coolify) set POSTGRES_PASSWORD to a long random value.
#
# Secrets come from ./.env (copy .env.example). The database here is local, so DATABASE_URL is set
# below and overrides any Neon URL in .env.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careconnect-dev}
      POSTGRES_DB: careconnect
    # Bound to localhost only: the database must never be reachable from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careconnect -d careconnect"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Applies pending migrations, then exits. The API starts only after it succeeds.
  migrate:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://careconnect:${POSTGRES_PASSWORD:-careconnect-dev}@db:5432/careconnect
      DATABASE_SSL: disable
    command: ["node", "dist/db/migrate.js"]
    # Coolify: this container exits after migrating, so keep it out of the stack's health status.
    labels:
      - exclude_from_hc=true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      DATABASE_URL: postgres://careconnect:${POSTGRES_PASSWORD:-careconnect-dev}@db:5432/careconnect
      DATABASE_SSL: disable
    # Bound to localhost only. On Coolify, assign the domain to this service (port 3000) so traffic
    # goes through its HTTPS proxy; direct access would let clients spoof X-Forwarded-For.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # TURN/STUN relay for video consultations, used when a direct browser-to-browser connection is blocked.
  # It accepts only time-limited credentials made by the API from VIDEO_TURN_SECRET (see src/services/video.service.ts).
  # In production set VIDEO_PUBLIC_IP to the server's public IP and open 3478 (UDP and TCP) and 49160-49200 (UDP).
  coturn:
    image: coturn/coturn:4.6.2
    environment:
      VIDEO_TURN_SECRET: ${VIDEO_TURN_SECRET:?Set VIDEO_TURN_SECRET in .env (32+ random characters)}
      VIDEO_PUBLIC_IP: ${VIDEO_PUBLIC_IP:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec turnserver -n --log-file=stdout --fingerprint --no-cli --realm=isanomed
        --use-auth-secret --static-auth-secret="$$VIDEO_TURN_SECRET"
        --listening-port=3478 --min-port=49160 --max-port=49200
        $${VIDEO_PUBLIC_IP:+--external-ip=$$VIDEO_PUBLIC_IP}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

volumes:
  pgdata:
