# Backend stack: Postgres (container), one-off migrations, and the API.
# Run from this folder:  docker compose up --build
# API:       http://localhost:3000/health
# Postgres:  localhost:5432  (user careconnect, db careconnect; localhost only)
# In production (Coolify) set POSTGRES_PASSWORD to a long random value.
#
# Secrets come from ./.env (copy .env.example). The database here is local, so DATABASE_URL is set
# below and overrides any Neon URL in .env.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careconnect-dev}
      POSTGRES_DB: careconnect
    # Bound to localhost only: the database must never be reachable from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careconnect -d careconnect"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Applies pending migrations, then exits. The API starts only after it succeeds.
  migrate:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://careconnect:${POSTGRES_PASSWORD:-careconnect-dev}@db:5432/careconnect
      DATABASE_SSL: disable
    command: ["node", "dist/db/migrate.js"]
    # Coolify: this container exits after migrating, so keep it out of the stack's health status.
    labels:
      - exclude_from_hc=true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      DATABASE_URL: postgres://careconnect:${POSTGRES_PASSWORD:-careconnect-dev}@db:5432/careconnect
      DATABASE_SSL: disable
    # Bound to localhost only. On Coolify, assign the domain to this service (port 3000) so traffic
    # goes through its HTTPS proxy; direct access would let clients spoof X-Forwarded-For.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # TURN relay for video consultations, used when a direct browser-to-browser connection is blocked.
  # It accepts only time-limited credentials made by the API from VIDEO_TURN_SECRET (see src/services/video.service.ts).
  #
  # Browsers reach it as TURN over TLS on port 443 (turns:VIDEO_TURN_DOMAIN:443?transport=tcp): the reverse proxy
  # (Traefik, as used by Coolify) terminates TLS for VIDEO_TURN_DOMAIN and forwards the connection to coturn:3478.
  # Only 80/443 must reach the server, so this works behind NAT and on networks that allow nothing but HTTPS.
  # When both callers relay, coturn passes media between them internally (public address mapped to its own).
  coturn:
    image: coturn/coturn:4.6.2
    environment:
      VIDEO_TURN_SECRET: ${VIDEO_TURN_SECRET:?Set VIDEO_TURN_SECRET in .env (32+ random characters)}
      VIDEO_PUBLIC_IP: ${VIDEO_PUBLIC_IP:-}
      VIDEO_RELAY_MIN_PORT: ${VIDEO_RELAY_MIN_PORT:-49152}
      VIDEO_RELAY_MAX_PORT: ${VIDEO_RELAY_MAX_PORT:-65535}
    entrypoint: ["/bin/sh", "-c"]
    # Relaying to private, loopback and link-local addresses is denied, so the relay cannot reach other containers
    # or the host. The one exception is coturn's own address, needed to pass media between two relayed callers.
    command:
      - >-
        SELF_IP=$$(hostname -i | awk '{print $$1}');
        exec turnserver -n --log-file=stdout --fingerprint --no-cli --realm=isanomed
        --use-auth-secret --static-auth-secret="$$VIDEO_TURN_SECRET"
        --listening-port=3478 --min-port=$$VIDEO_RELAY_MIN_PORT --max-port=$$VIDEO_RELAY_MAX_PORT
        --no-tls --no-dtls --no-multicast-peers --no-tcp-relay
        --denied-peer-ip=0.0.0.0-0.255.255.255
        --denied-peer-ip=10.0.0.0-10.255.255.255
        --denied-peer-ip=100.64.0.0-100.127.255.255
        --denied-peer-ip=127.0.0.0-127.255.255.255
        --denied-peer-ip=169.254.0.0-169.254.255.255
        --denied-peer-ip=172.16.0.0-172.31.255.255
        --denied-peer-ip=192.168.0.0-192.168.255.255
        --denied-peer-ip=::1
        --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
        --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
        --relay-ip=$$SELF_IP --allowed-peer-ip=$$SELF_IP
        $${VIDEO_PUBLIC_IP:+--external-ip=$$VIDEO_PUBLIC_IP/$$SELF_IP}
    # Local development only: reachable on this machine at turn:localhost:3478. Not published to the internet.
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.isanomed-turn.entrypoints=https
      - traefik.tcp.routers.isanomed-turn.rule=HostSNI(`${VIDEO_TURN_DOMAIN:-turn.localhost}`)
      - traefik.tcp.routers.isanomed-turn.tls=true
      - traefik.tcp.routers.isanomed-turn.tls.certresolver=letsencrypt
      - traefik.tcp.routers.isanomed-turn.service=isanomed-turn
      - traefik.tcp.services.isanomed-turn.loadbalancer.server.port=3478
    restart: unless-stopped

volumes:
  pgdata:
